<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Carimbo de madeira com borracha vermelha -->
  <!-- Pegador -->
  <ellipse cx="30" cy="10" rx="9" ry="7" fill="#8d5a2b" stroke="#5d3a1a" stroke-width="1"/>
  <ellipse cx="27" cy="8" rx="3" ry="2" fill="#b07a45"/>
  <!-- Haste -->
  <rect x="25" y="15" width="10" height="16" rx="2" fill="#a0693a" stroke="#5d3a1a" stroke-width="1"/>
  <!-- Base de madeira -->
  <rect x="8" y="30" width="44" height="12" rx="2" fill="#8d5a2b" stroke="#5d3a1a" stroke-width="1"/>
  <rect x="10" y="32" width="40" height="3" rx="1" fill="#b07a45"/>
  <!-- Borracha com tinta -->
  <rect x="10" y="42" width="40" height="6" rx="1" fill="#c62828"/>
  <!-- Pingos de tinta -->
  <circle cx="16" cy="53" r="1.6" fill="#c62828"/>
  <circle cx="42" cy="55" r="1.3" fill="#c62828"/>
</svg>
