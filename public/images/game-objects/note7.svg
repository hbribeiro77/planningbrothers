  <path d="M20 18 Q19 11 24 8 Q23 13 27 14 Q27 9 31 6 Q31 12 35 13 Q36 9 39 10 Q41 15 39 18 Z" fill="#ff7a00"/>
  <path d="M24 18 Q24 14 27 12 Q27 15 30 15 Q31 12 33 11 Q34 15 36 18 Z" fill="#ffd000"/>
