<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Processo físico: pilha de autos de papelão amarrados com barbante -->
  <!-- Volume de baixo -->
  <rect x="5" y="40" width="50" height="11" rx="1.5" fill="#b07d3e" stroke="#7a5326" stroke-width="1"/>
  <rect x="7" y="38" width="46" height="3" fill="#f5f0e1"/>
  <!-- Volume do meio (torto) -->
  <g transform="rotate(-4 30 33)">
    <rect x="6" y="28" width="48" height="11" rx="1.5" fill="#c49352" stroke="#7a5326" stroke-width="1"/>
    <rect x="8" y="26" width="44" height="3" fill="#f5f0e1"/>
  </g>
  <!-- Volume de cima -->
  <g transform="rotate(3 30 20)">
    <rect x="7" y="14" width="46" height="12" rx="1.5" fill="#d4a463" stroke="#7a5326" stroke-width="1"/>
    <rect x="9" y="12" width="42" height="3" fill="#f5f0e1"/>
    <!-- Etiqueta -->
    <rect x="21" y="16.5" width="18" height="7" rx="1" fill="#fffdf5" stroke="#7a5326" stroke-width="0.6"/>
    <text x="30" y="22" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="#333" text-anchor="middle">AUTOS</text>
  </g>
  <!-- Folhas escapando -->
  <path d="M52 30 L58 27 L58 33 Z" fill="#fffdf5" stroke="#bbb" stroke-width="0.5"/>
  <path d="M3 44 L8 41 L8 47 Z" fill="#fffdf5" stroke="#bbb" stroke-width="0.5"/>
  <!-- Barbante -->
  <path d="M30 11 L30 51" stroke="#8d6e63" stroke-width="1.6"/>
  <path d="M27 9 Q30 12 33 9" stroke="#8d6e63" stroke-width="1.4" fill="none"/>
</svg>
