  <ellipse cx="30" cy="41" rx="27" ry="7" fill="#c8812e"/>
  <ellipse cx="30" cy="39.5" rx="27" ry="6" fill="#e0a04c"/>
  <!-- Alface (ondulada, saindo bem pra fora) -->
  <path d="M2 37 Q5 33 8 37 Q11 33 14 37 Q17 33 20 37 Q23 33 26 37 Q29 33 32 37 Q35 33 38 37 Q41 33 44 37 Q47 33 50 37 Q53 33 56 37 Q59 34 58 38 Q30 44 2 38 Z" fill="#5cb85c"/>
  <!-- Tomate -->
  <ellipse cx="17" cy="35.5" rx="7" ry="2.2" fill="#e04b3a"/>
  <ellipse cx="42" cy="35.5" rx="7" ry="2.2" fill="#e04b3a"/>
  <!-- Bife -->
  <ellipse cx="30" cy="33" rx="25" ry="4" fill="#6b3a1f"/>
  <!-- Queijo derretendo -->
  <path d="M6 31 L54 31 L52 33 L49 37 L47 33 L40 33 L37 36.5 L35 33 L22 33 L19 37.5 L17 33 L8 33 Z" fill="#ffcc33"/>
  <!-- Ovo (clara + gema) -->
  <ellipse cx="30" cy="30" rx="11" ry="3" fill="#fffaf0"/>
  <ellipse cx="31" cy="29.5" rx="4" ry="1.8" fill="#ffb300"/>
  <!-- Milho e ervilha caindo -->
  <circle cx="9" cy="38.5" r="1.3" fill="#ffd54f"/>
  <circle cx="12" cy="40" r="1.2" fill="#7cb342"/>
  <circle cx="47" cy="39.5" r="1.3" fill="#ffd54f"/>
  <circle cx="51" cy="38.5" r="1.2" fill="#7cb342"/>
  <circle cx="44" cy="41" r="1.1" fill="#7cb342"/>
  <!-- Pão de cima: largo e achatado (prensado) -->
  <path d="M3 28 Q4 17 30 16 Q56 17 57 28 Q57 30 54 30 L6 30 Q3 30 3 28 Z" fill="#e0a04c"/>
  <path d="M5 27.5 Q6 19 30 18 Q54 19 55 27.5" stroke="#c8812e" stroke-width="1.2" fill="none"/>
  <!-- Marcas da chapa -->
  <path d="M14 21 L20 27" stroke="#9a5a1c" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M24 19 L30 27" stroke="#9a5a1c" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M34 19 L40 27" stroke="#9a5a1c" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M44 21 L48 26" stroke="#9a5a1c" stroke-width="1.6" stroke-linecap="round"/>
</svg>
